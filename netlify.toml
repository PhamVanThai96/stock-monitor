[build]
  publish = "public"
  command = "true"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  directory = "netlify/functions"
  # Đóng gói toàn bộ thư mục dev/ (chứa analysis_script.py và các module phụ thuộc)
  # cùng với function để "analyze.py" có thể import trực tiếp từ đó khi chạy trên Netlify.
  included_files = ["dev/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
